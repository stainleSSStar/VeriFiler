[package]
name = "verifiler"
version = "0.1.0"
edition = "2021"
description = "Portable file integrity tool: calculate and verify checksums (MD5, SHA-1/2/3, BLAKE2/3, CRC32)"
license = "MIT"

[dependencies]
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1"
crc32fast = "1"
digest = "0.10"
hex = "0.4"
same-file = "1"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
strip = true
