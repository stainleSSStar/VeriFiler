name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Check lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --release --locked

  build-binaries:
    name: Build binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: test
    env:
      ARCHIVE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: linux-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: macos-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: macos-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: windows-x64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive (unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/verifiler dist/
          cp README.md dist/
          tar -czf "verifiler-$ARCHIVE_VERSION-${{ matrix.archive }}" -C dist verifiler README.md
      - name: Archive (windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/verifiler.exe dist/
          cp README.md dist/
          Compress-Archive -Path dist/verifiler.exe, README.md -DestinationPath "verifiler-$env:ARCHIVE_VERSION-${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: verifiler-*-${{ matrix.archive }}

  release:
    name: Upload release binaries
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
