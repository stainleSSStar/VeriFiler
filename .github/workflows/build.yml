name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Check lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --release --locked

  build-binaries:
    name: Build binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: test
    env:
      ARCHIVE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: linux-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: macos-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: macos-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: windows-x64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test native binary
        if: (runner.arch == 'ARM64' && startsWith(matrix.target, 'aarch64-')) || (runner.arch == 'X64' && startsWith(matrix.target, 'x86_64-'))
        run: cargo run --release --locked --target ${{ matrix.target }} -- --version
      - name: Archive (unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/verifiler dist/
          cp README.md LICENSE dist/
          archive_version=${ARCHIVE_VERSION//[^a-zA-Z0-9._-]/_}
          archive_path="verifiler-$archive_version-${{ matrix.archive }}"
          tar -czf "$archive_path" -C dist verifiler README.md LICENSE
          digest=$(shasum -a 256 "$archive_path" | cut -d ' ' -f 1)
          printf 'sha256 %s\n' "$digest" > "$archive_path.vf"
      - name: Archive (windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/verifiler.exe dist/
          cp README.md dist/
          cp LICENSE dist/
          $archiveVersion = $env:ARCHIVE_VERSION -replace '[^a-zA-Z0-9._-]', '_'
          $archivePath = "verifiler-$archiveVersion-${{ matrix.archive }}"
          Compress-Archive -Path dist/verifiler.exe, dist/README.md, dist/LICENSE -DestinationPath $archivePath
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$archivePath.vf" -Value "sha256 $digest" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            verifiler-*-${{ matrix.archive }}
            verifiler-*-${{ matrix.archive }}.vf

  release:
    name: Upload release binaries
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
